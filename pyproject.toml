[project]
name = "ai-maze-learning-lab"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.163.1", "numpy>=2.2,<3", "uvicorn[standard]>=0.49,<1"]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "lab"]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "npm ci && npm run build"

[tool.pytest.ini_options]
testpaths = ["tests"]
